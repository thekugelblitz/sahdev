services:
  db:
    extends:
      file: compose.yaml
      service: db
  migrate:
    extends:
      file: compose.yaml
      service: app
    command: [sh, -ec, 'php artisan migrate --force && php artisan db:seed --force']
    restart: 'no'
    mem_limit: 256m
  app:
    extends:
      file: compose.yaml
      service: app
    networks:
      private:
        aliases: [sahdev-cloud-fpm]
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    extends:
      file: compose.yaml
      service: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
  scheduler:
    extends:
      file: compose.yaml
      service: scheduler
    depends_on:
      migrate:
        condition: service_completed_successfully
  business:
    build: ../business
    environment:
      SAHDEV_AUTH_MODE: cloud
      SAHDEV_HOST: 0.0.0.0
      SAHDEV_ORIGIN: ${APP_URL:?Set the public HTTPS application URL}
      SAHDEV_DATA_DIR: /data
    volumes: [business_data:/data]
    expose: ['8080']
    networks: [private]
    restart: unless-stopped
    mem_limit: 384m
    security_opt: [no-new-privileges:true]
  web:
    image: sahdev-web:${RELEASE_TAG:-local}
    build:
      context: .
      target: web
    command: [caddy, run, --config, /etc/caddy/DokployCaddyfile, --adapter, caddyfile]
    expose: ['80']
    depends_on: [app]
    restart: unless-stopped
    mem_limit: 128m
    networks:
      private:
        aliases: [sahdev-business-gateway]
      dokploy-network: {}
    labels:
      traefik.docker.network: dokploy-network
    security_opt: [no-new-privileges:true]
networks:
  private:
    driver: bridge
  dokploy-network:
    external: true
volumes:
  storage:
  pgdata:
  business_data:
