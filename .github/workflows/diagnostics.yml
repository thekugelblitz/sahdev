name: Diagnostic regression checks
on:
  push:
    branches: [v5.0]
  pull_request:
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, dom, curl
          coverage: none
      - name: Syntax
        run: find lib controllers modules -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Offline contract and lifecycle checks
        run: |
          php scratch/test_diagnostic_contracts.php
          php scratch/test_diagnostic_workflow.php
          php scratch/test_diagnostic_providers.php
          php scratch/test_settings_theme.php
