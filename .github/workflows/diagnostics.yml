name: Diagnostic regression checks
on:
  push:
    branches: [v5.0, saas]
  pull_request:
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, dom, curl
          coverage: none
      - name: Syntax
        run: |
          find lib controllers modules -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l hooks.php
          php -l ajax.php
      - name: Offline contract and lifecycle checks
        run: |
          php scratch/test_diagnostic_contracts.php
          php scratch/test_diagnostic_workflow.php
          php scratch/test_diagnostic_providers.php
          php scratch/test_cloud_connector.php
          php scratch/test_diagnostic_exchange.php
          php scratch/test_settings_theme.php
          php scratch/test_command_station.php
          php scratch/test_copilot.php
          php scratch/test_copilot_database.php
          node scratch/test_copilot_ajax.cjs
  copilot-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, curl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Copilot browser flows
        run: node scratch/test_copilot_ui.cjs
  copilot-innodb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: sahdev_copilot_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Concurrent database approval and rollback
        env:
          SAHDEV_COPILOT_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=sahdev_copilot_test'
          SAHDEV_COPILOT_MYSQL_USER: root
        run: php scratch/test_copilot_mysql.php
