<body data-theme="black" data-density="comfortable">
<header class="labbar"><div class="brand"><span class="brandmark">s</span> SAHDEV <small> / Workflow Studio</small></div><div class="controls"><label><span>Appearance</span><select data-pref="theme" aria-label="Appearance"><option value="black">Black · #000 / #222</option><option value="dark">Charcoal dark</option><option value="white">White</option></select></label><label><span>Density</span><select data-pref="density" aria-label="Density"><option value="comfortable">Comfortable</option><option value="compact">Compact</option><option value="featured">Featured</option></select></label><button data-action="preferences">My Sahdev</button></div></header>
<main class="labwrap"><section id="gallery-view"></section><section id="detail-view" hidden></section><section id="compare-view" hidden></section></main>
<div id="drawer" class="drawer" hidden><section class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><div class="drawer-head"><h2 id="drawer-title"></h2><button data-action="close" aria-label="Close panel">×</button></div><div id="drawer-content"></div></section></div><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const icons={spark:'M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z',arrow:'M5 12h14M13 6l6 6-6 6',check:'M5 12l4 4L19 6',tools:'M14 5a5 5 0 0 0-6 6L3 16l5 5 5-5a5 5 0 0 0 6-6l-4 4-5-5z',file:'M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6',book:'M3 4h7l2 2 2-2h7v15h-7l-2 2-2-2H3zM12 6v15',clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M12 7v6l4 2',sliders:'M4 6h16M4 12h16M4 18h16M8 4v4M16 10v4M10 16v4',copy:'M9 8h11v13H9zM5 16H3V3h12v2',insert:'M12 3v12M7 10l5 5 5-5M4 17v4h16v-4',warn:'M12 3L2 21h20zM12 9v5M12 17v1',search:'M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14M15 15l6 6',star:'M12 3l3 6 6 1-4.5 4.5 1 6.5-5.5-3-5.5 3 1-6.5L3 10l6-1z',back:'M19 12H5M11 6l-6 6 6 6',grid:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[n]||icons.file}"/></svg>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const designs=[
{name:'Resolution Desk',class:'desk',tag:'Everyday support',summary:'A quiet answer space with a persistent investigation rail.',why:'Staff can read the proposed reply while keeping the cause, risk, and next action in view. Configuration takes one deliberate step.',trade:'The narrow rail is best for concise evidence. Long diagnostics open in the tools panel.',ship:'Use the existing analysis and reply outputs. Add the shared settings drawer and keep the ticket editor below.',recommended:true},
{name:'Evidence Board',class:'board-layout',tag:'Technical investigation',summary:'Observe, interpret, respond. Three distinct areas with a clear reading order.',why:'Tool results sit next to the conclusion they support. Staff can spot missing or conflicting evidence before drafting.',trade:'The three columns need a wide display; on smaller screens the reply moves below evidence.',ship:'Reuse tool results and the analysis fields; include source timestamps and a visible failed-check state.'},
{name:'Reply Atelier',class:'atelier',tag:'Careful communication',summary:'An editorial writing surface, with the generation brief in a side inspector.',why:'The response gets a comfortable line length and larger type. Instructions remain visible without crowding the draft.',trade:'Detailed analysis is one step away. Best when communicating the answer takes more work than finding it.',ship:'Keep provider selection, tone, depth and instructions in the inspector; place technical review in the evidence drawer.'},
{name:'Guided Resolution',class:'guided',tag:'Consistent process',summary:'A four-step flow: brief, verify, draft, review. Jump between steps at any time.',why:'The sequence makes evidence review and human approval explicit, while keeping each screen manageable for new staff.',trade:'Experienced staff may prefer fewer transitions. Step navigation remains freely accessible.',ship:'No backend workflow engine is needed. Keep steps in the interface and preserve the existing generation endpoint.',recommended:true},
{name:'Case Timeline',class:'timeline-layout',tag:'Long-running tickets',summary:'A chronological investigation that keeps evidence and decisions in context.',why:'Handoffs become easier when staff can see what was reported, what was checked, and what changed.',trade:'History grows vertically. Older events should collapse after a useful limit.',ship:'Use existing ticket events and tool timestamps. Keep personal configuration beside the timeline.'},
{name:'Queue Sprint',class:'sprint',tag:'Fast repetitive work',summary:'A compact queue, quick response controls, and a persistent case summary.',why:'Staff can handle repeated ticket patterns with fewer navigation steps while keeping each ticket’s draft separate.',trade:'Requires careful draft isolation and unsaved-change handling when switching tickets.',ship:'Connect the ticket picker to permitted WHMCS tickets; key all draft state by ticket and staff IDs.'},
{name:'Decision Brief',class:'brief',tag:'Complex decisions',summary:'A readable case document with a clear division between reasoning and response.',why:'The hierarchy encourages reading the decision before taking action. Long explanations remain comfortable.',trade:'Less suited to frequent tool execution. Technical controls live in the supporting panels.',ship:'Use the current root cause, risk, responsibility and plan fields; avoid adding more AI output fields.'},
{name:'Focus Dock',class:'focus',tag:'Minimal embedded panel',summary:'A full-width reply with a compact command dock that opens focused controls.',why:'The ticket stays readable. Staff can open just the controls they need and return to the same reply position.',trade:'Some controls are hidden until requested; clear labels and keyboard access are essential.',ship:'Fits the existing ticket panel without replacing the WHMCS page. Use one reusable accessible drawer.',recommended:true},
{name:'Review Room',class:'review-layout',tag:'Quality and verification',summary:'Evidence on the left, client-facing claims on the right, with a review checklist.',why:'A good-looking reply is not treated as proof. Staff explicitly inspect account context, tool evidence, and wording.',trade:'Adds review steps to simple tickets. Use as a staff preference or for higher-risk cases.',ship:'The checklist is local UI state. Keep generation, copy, and insertion separate; insertion must never send a reply.'},
{name:'Operator Console',class:'console',tag:'Technical specialists',summary:'Searchable tool commands and compact output alongside the client response.',why:'DNS, HTTP and SSL checks are quick to reach. Raw findings stay close to the interpretation without filling the reply.',trade:'A specialist interface with less visual guidance. Offer familiar buttons alongside the command field.',ship:'Map known commands to the existing allowlisted tools. Never execute arbitrary commands from this field.'},
{name:'Adaptive Stack',class:'adaptive',tag:'Small screens & accessibility',summary:'Independent expandable sections with useful summaries and completion indicators.',why:'One stable reading order works on narrow and wide screens. Staff choose how much of the workspace stays open.',trade:'More vertical scrolling when every section is expanded. Remember each staff member’s preferred sections.',ship:'Native disclosure controls keep keyboard and screen-reader behavior predictable; reuse existing forms.'},
{name:'Team Handoff',class:'handoff',tag:'Escalations & ownership',summary:'An internal handoff brief and a public reply, clearly separated by audience.',why:'Responsibility, uncertainty, and the next action are explicit. Internal notes are visually distinct from client wording.',trade:'Ownership changes need permission checks and an audit trail when wired to production.',ship:'Keep the initial version read-only for ownership; map approved handoff actions to WHMCS ticket updates.'}
];
const intents=['AI Auto Decides','Resolved Query','Checking Query','Need More Info','Guide To Solution','Escalate','Out Of Scope','Abuse Report','Duplicate Ticket','Handle It!','On Leave'];
const initialReply='Hello Sandeep,\n\nI checked the website’s DNS and HTTP response. The A record returned 203.0.113.24, and the website returned HTTP 503 during the check.\n\nThat address differs from the hosting IP recorded on your service. A CDN or proxy may explain the difference, so we should confirm the intended destination before changing DNS.\n\nI’m checking the origin service next. Please let us know whether a CDN or proxy was recently enabled.';
const state={intent:'Checking Query',tone:'Friendly',depth:3,instruction:'Explain verified findings clearly. Confirm any CDN before recommending a DNS change.',model:'Default · GPT 5.6 Luna',technical:'',summary:true,notes:true,evidence:true,target:'example.com',tool:'DNS A record',toolState:'ready',toolError:false,reply:initialReply,rough:'',editor:'',reviewContext:false,reviewEvidence:false,reviewWording:false,owner:'Technical Support',memory:'Last 7 tickets',kbSearch:'',step:0,queue:0,generation:0,busy:false,collapsed:false};
let preferences={theme:'black',density:'comfortable',favorites:[],defaultDesign:0},current=0,filter='all',view='gallery',restoreFocus=null;
try{const saved=JSON.parse(localStorage.getItem('sahdev-timeline-refinements-v1')||'null');if(saved&&typeof saved==='object'){if(['black','dark','white'].includes(saved.theme))preferences.theme=saved.theme;if(['compact','comfortable','featured'].includes(saved.density))preferences.density=saved.density;if(Array.isArray(saved.favorites))preferences.favorites=saved.favorites.filter(n=>Number.isInteger(n)&&n>=0&&n<12);if(Number.isInteger(saved.defaultDesign)&&saved.defaultDesign>=0&&saved.defaultDesign<12)preferences.defaultDesign=saved.defaultDesign}}catch{}
const savePrefs=()=>{try{localStorage.setItem('sahdev-timeline-refinements-v1',JSON.stringify(preferences));return true}catch{return false}};
const btn=(text,action,cls='',symbol='')=>`<button type="button" class="${cls}" data-action="${action}">${symbol?icon(symbol):''}${text}</button>`;
const field=(name,title,value=state[name],kind='text')=>`<label class="field">${title}${kind==='textarea'?`<textarea data-field="${name}">${esc(value)}</textarea>`:`<input type="text" data-field="${name}" value="${esc(value)}">`}</label>`;
const select=(name,title,options)=>`<label class="field">${title}<select data-field="${name}">${options.map(x=>`<option${String(state[name])===x?' selected':''}>${esc(x)}</option>`).join('')}</select></label>`;
const check=(name,title)=>`<label class="check"><input type="checkbox" data-field="${name}"${state[name]?' checked':''}>${title}</label>`;
function header(){return `<header class="station-head"><div class="brand"><span class="brandmark">s</span>Sahdev <small>Ticket intelligence</small></div><div class="server"><i class="dot"></i>NCR1 · Mumbai <span>26.84 / 24.23 / 22.36</span></div><span class="grow"></span>${btn('Preferences','preferences','ghost small','sliders')}${btn('Help & KB','help','ghost small','book')}${btn(state.collapsed?'Expand':'Collapse','collapse','ghost small')}</header>`}
function tabs(){return `<nav class="tabs" aria-label="Ticket intelligence sections">${btn('Analysis','analysis','active','spark')}${btn('Tools','tools','','tools')}${btn('Summary','summary','','file')}${btn('KB','kb','','book')}${btn('Memory','memory','','clock')}</nav>`}
function intent(compact=false){return compact?select('intent','Reply intent',intents):`<div><div class="eyebrow">Reply intent</div><div class="intent-list">${intents.map(x=>`<button type="button" data-intent="${x}" aria-pressed="${state.intent===x}">${x}</button>`).join('')}</div></div>`}
function settings(horizontal=false){return `<div class="fields${horizontal?' horizontal':''}">${select('tone','AI tone',['Friendly','Professional','Technical','Strict'])}<label class="field">Dive intensity <span><output data-output="depth">${state.depth}</output> / 5</span><input type="range" min="1" max="5" data-field="depth" value="${state.depth}"></label><div class="wide">${field('instruction','Custom instruction · optional',state.instruction,'textarea')}</div></div><div style="margin-top:14px">${select('model','Model for this generation',['Default · GPT 5.6 Luna','Replicate · google/gemini-3-flash','My preferred provider'])}</div>`}
function evidenceOptions(){return `<div class="checks">${check('summary','Feed Summary')}${check('notes','Include Ticket Notes')}${check('evidence','Include Tool Evidence')}</div>`}
function technical(){return `<details><summary>Technical context <span class="muted">· optional</span></summary><div class="stack">${field('technical','Paste logs, verified notes, or tool output',state.technical,'textarea')}${btn('Paste from clipboard','paste','small','copy')}</div></details>`}
function generation(){return `<div class="generation">${btn(state.busy?'Preparing draft…':'Analyze & Generate Reply','generate','primary','spark')}${btn('Regenerate','regenerate','ghost','clock')}</div>`}
function baseFacts(){return `<div class="stack"><div><div class="eyebrow">Root cause · working hypothesis</div><p class="lead">The origin is unavailable; the routing difference needs verification.</p><p class="muted">HTTP 503 confirms a failed request. The DNS mismatch alone does not prove incorrect configuration.</p></div><div class="fact-grid"><div><small>Responsibility</small>Hosting / routing review</div><div><small>Risk level</small><span class="chip warn">Medium · avoid blind DNS changes</span></div></div><div class="facts"><h4>Action plan · internal</h4><ol class="plan"><li>Confirm whether the domain uses a CDN or proxy.</li><li>Verify the expected origin and its web service.</li><li>Repeat HTTP checks after any approved correction.</li><li>Update the client with the verified result.</li></ol></div></div>`}
function baseEvidence(){return `<div><div class="section-head"><h3>Verified context</h3><span class="chip">${state.toolState==='running'?'Checking…':'Demo snapshot'}</span></div><div class="evidence-row"><span class="status-icon">${icon('check')}</span><div><b>Hosting service is active</b><small>WHMCS · account context</small></div><span class="source">now</span></div><div class="evidence-row"><span class="status-icon warn">${icon('warn')}</span><div><b>A → 203.0.113.24</b><small>Expected origin: 203.0.113.10 · confirm proxy</small></div><span class="source">DNS</span></div><div class="evidence-row"><span class="status-icon warn">${icon('warn')}</span><div><b>${state.toolState==='failed'?'HTTP check timed out':'HTTP 503 · service unavailable'}</b><small>${state.toolState==='failed'?'Result unavailable; do not treat as healthy':'One observation · not a sustained outage claim'}</small></div><span class="source">HTTP</span></div><div class="evidence-row"><span class="status-icon">${icon('check')}</span><div><b>Certificate is valid</b><small>SSL check · 62 days remaining</small></div><span class="source">TLS</span></div></div>`}
function toolControls(){return `<div class="stack">${field('target','Domain, hostname, IP or email')}${select('tool','Check to run',['DNS A record','HTTP status','SSL certificate','MX & email records','IP lookup'])}<div class="row">${btn(state.toolState==='running'?'Checking…':'Run check','run-tool','accent','tools')}${btn('Append to context','append-tool','small')}</div><label class="check"><input type="checkbox" data-field="toolError"${state.toolError?' checked':''}>Simulate an unavailable tool</label>${state.toolState==='failed'?'<div class="notice">'+icon('warn')+'The check timed out. Previous results are retained and marked stale. Retry is available.</div>':''}</div>`}
function reply(){return `<section class="reply"><div class="reply-paper"><div class="section-head"><h3>Proposed client reply</h3><span class="chip ok">AI score · 95/100</span></div><div class="reply-text" data-reply>${esc(state.reply)}</div><div class="reply-tools"><div class="row">${btn('Copy','copy','small','copy')}${btn('Edit draft','edit-reply','small')}</div>${btn('Insert into ticket','insert','primary','insert')}</div><div class="metrics">Intent: ${esc(state.intent)} · 8,944 in / 534 out · 11.7 s · ${state.generation?'revision '+state.generation:'sample generation'}</div></div></section>`}
function rewrite(){return `<section class="rewrite"><div class="section-head"><h3>Expand & polish my draft</h3><span class="eyebrow">Your words, refined</span></div>${field('rough','Rough reply',state.rough,'textarea')}<div class="row">${btn('Rewrite It','rewrite','','spark')}${btn('Score Admin Draft','score','ghost')}${btn('Save as Canned','save-canned','ghost small')}${btn('Save KB Draft','save-kb','ghost small')}</div></section>`}
function supportControls(){return `<div class="row">${btn('Intent & generation','settings','','sliders')}${btn('Evidence & tools','tools','','tools')}${btn('Rewrite draft','rewrite-panel','','file')}</div>`}
function ticketIntro(){return `<div><div class="eyebrow">Ticket #84216 / Technical support</div><h2>Website is not loading</h2><p class="muted">Sandeep · example.com · Active hosting</p></div>`}
function footer(){return `<div class="footer-bar"><p>Draft only · insertion fills the editor for human review.</p><div class="row">${btn('Summary','summary','ghost small')}${btn('Memory','memory','ghost small')}${btn('Knowledge base','kb','ghost small')}</div></div>`}
function editor(){return state.editor?`<div class="inserted"><h3>WHMCS reply editor · local preview</h3>${field('editor','Inserted reply · not sent',state.editor,'textarea')}<div class="row" style="margin-top:10px">${btn('Clear editor preview','clear-editor','small')}<span class="muted">Nothing is sent from this prototype.</span></div></div>`:''}
function layout(n,mini=false){const d=designs[n];let body='';
if(n===0)body=`${tabs()}<div class="split"><aside class="stack">${ticketIntro()}${intent(true)}${facts()}${btn('Model, tone & instructions','settings','','sliders')}${btn('Inspect all evidence','tools','','tools')}</aside><main>${reply()}<div class="pad divider stack">${evidenceOptions()}${generation()}</div><div class="rewrite">${rewrite()}</div></main></div>${footer()}`;
if(n===1)body=`${tabs()}<div class="board-brief">${intent(true)}${field('instruction','Generation brief')}<div>${btn('Model & tone','settings','','sliders')}</div></div><div class="lanes"><section class="lane stack"><div><div class="lane-number">01</div><h2>Observe</h2><p class="muted">What we can actually verify.</p></div>${evidence()}${toolControls()}${technical()}</section><section class="lane stack"><div><div class="lane-number">02</div><h2>Interpret</h2><p class="muted">What the evidence supports.</p></div>${facts()}${evidenceOptions()}${generation()}</section><section class="lane"><div class="lane-number">03</div><h2>Respond</h2><p class="muted">A clear next step for the client.</p>${reply()}<div class="divider" style="margin-top:20px">${btn('Polish my draft','rewrite-panel','','file')}</div></section></div>${footer()}`;
if(n===2)body=`<div class="studio-grid"><nav class="icon-rail" aria-label="Support panels">${btn('','analysis','', 'spark')}${btn('','tools','','tools')}${btn('','summary','','file')}${btn('','kb','','book')}${btn('','memory','','clock')}</nav><main class="writing-sheet"><div class="draft-meta">Correspondence / Sandeep / Ticket #84216</div>${reply()}${rewrite()}</main><aside class="inspector stack"><div><div class="eyebrow">The brief</div><h2>Shape the response.</h2></div>${intent(true)}${settings()}${technical()}${evidenceOptions()}${generation()}${btn('Review findings','analysis','ghost','search')}</aside></div>${footer()}`;
if(n===3){const step=mini?0:state.step;const steps=['Brief','Verify','Draft','Review'];const content=[`<div class="step-title"><div class="eyebrow">01 / Establish the brief</div><h2>What should this reply accomplish?</h2><p>Choose intent, tone and instructions before reviewing the evidence.</p></div><div class="step-columns"><div>${intent()}<div class="divider" style="margin-top:25px">${settings(true)}</div></div><div class="stack soft box">${ticketIntro()}${evidenceOptions()}${technical()}</div></div>`,`<div class="step-title"><div class="eyebrow">02 / Check the facts</div><h2>Keep uncertainty visible.</h2><p>A failed check remains a missing result. Review the source before using it.</p></div><div class="step-columns"><div class="stack">${evidence()}${toolControls()}</div><div class="stack">${facts()}${technical()}</div></div>`,`<div class="step-columns"><div>${reply()}</div><div class="stack">${generation()}${evidenceOptions()}${rewrite()}</div></div>`,`<div class="step-title"><div class="eyebrow">04 / Human review</div><h2>Ready for the ticket editor?</h2><p>Check the claims and the proposed next action. Insert when you are satisfied.</p></div><div class="step-columns"><div>${reply()}</div><div class="stack">${reviewChecks()}${facts()}</div></div>`][step];body=`${tabs()}<nav class="stepper" aria-label="Resolution steps">${steps.map((s,i)=>`<button data-step="${i}" class="${step===i?'active':''}" aria-current="${step===i?'step':'false'}"><span class="step-no">${i+1}</span>${s}</button>`).join('')}</nav><div class="step-body">${content}</div><div class="footer-bar">${btn('Previous','step-back','ghost','back')}<span class="muted">Step ${step+1} of 4 · move freely between steps</span>${btn(step===3?'Insert reviewed draft':'Continue',step===3?'insert':'step-next','primary','arrow')}</div>`}
if(n===4)body=`${tabs()}<div class="split"><main class="case-timeline">${ticketIntro()}<div class="event"><time>10:42</time><div><h3>Client reported</h3><p>“My website is not loading. Can you check where it points?”</p></div></div><div class="event"><time>10:43</time><div>${evidence()}${btn('Run another check','tools','small','tools')}</div></div><div class="event"><time>10:44</time><div><h3>Working diagnosis</h3>${facts()}</div></div><div class="event"><time>Draft</time><div>${reply()}</div></div></main><aside class="stack">${intent(true)}${settings()}${evidenceOptions()}${technical()}${generation()}${btn('Rewrite my reply','rewrite-panel','','file')}</aside></div>${footer()}`;

function loadQueue(n){if(n===state.queue)return true;if(state.busy||state.toolState==='running'){toast('Let the current sample check or draft finish before changing tickets.');return false;}queueDrafts[state.queue]=Object.fromEntries(ticketFields.map(k=>[k,state[k]]));state.queue=n;const q=queueDrafts[n]||{reply:n===1?'Hello Sandeep,\n\nPlease share the affected email address and any delivery error. I will review the domain’s MX records and the relevant service details before recommending a change.':'Hello Sandeep,\n\nPlease confirm the affected hostname and the certificate error you see. I will check the certificate and its renewal status before recommending the next step.',rough:'',editor:'',intent:'Need More Info',instruction:'Use the evidence available for this ticket. Ask for missing details.',technical:'',summary:true,notes:true,evidence:true,target:n===1?'example.net':'example.org',tool:n===1?'MX & email records':'SSL certificate',toolState:'pending',toolError:false,reviewContext:false,reviewEvidence:false,reviewWording:false,generation:0,caseChecked:false};Object.assign(state,q)}

const refinementDesigns=[
{name:'Timeline Plus',class:'timeline-plus',tag:'Closest refinement',summary:'A wider timeline beside case context and findings, followed by the complete response brief.',why:'Preserves the chronological approach you shortlisted. Staff review the history before shaping the response.',trade:'A longer page with a clear transition between investigation and drafting.'},
{name:'Three-Lane Case Desk',class:'timeline-lanes',tag:'Parallel investigation',summary:'History, context and response stay side by side, with every generation control in the middle lane.',why:'The timeline remains visible while staff adjust instructions and inspect the proposed reply.',trade:'Best on wide displays. Narrow screens move the reply below the investigation.'},
{name:'Evidence Ledger',class:'timeline-ledger',tag:'Fast factual scanning',summary:'A chronological evidence table exposes time, observation and source before the response controls.',why:'Client reports, account facts, tool observations and proposed actions are easy to distinguish.',trade:'Evidence needs concise summaries. Full raw output belongs in the Tools tab.'},
{name:'Split Chronicle',class:'timeline-split',tag:'History stays close',summary:'A dedicated chronology column accompanies context, findings, instructions and the reply.',why:'Staff can refer to case history throughout the response workflow without opening another panel.',trade:'The history column uses width. On smaller screens it returns to the top.'},
{name:'Event Ribbon',class:'timeline-ribbon',tag:'At-a-glance progression',summary:'An open sequence of event tiles, then case context, findings, controls and correspondence.',why:'The turning points of a short case are visible together with their source and time.',trade:'Long cases will need date grouping or pagination when connected to production.'},
{name:'Case Journal',class:'timeline-journal',tag:'Reading & handoff',summary:'An ordered case document: context, history, interpretation, response brief and correspondence.',why:'A calm reading order helps with complex cases and handoffs. Every control remains in the document.',trade:'A deliberate vertical workflow, with more scrolling than the denser layouts.'},
{name:'Case Milestones',class:'timeline-milestones',tag:'Understand the progression',summary:'Chronology grouped into Report, Verify and Decide. All three stages remain open.',why:'The distinction between the client report, observed evidence and proposed action is immediately visible.',trade:'Events need consistent classification, while retaining their original source and timestamp.'},
{name:'Evidence to Action',class:'timeline-map',tag:'Explain the next step',summary:'Each chronological observation is paired with its implication and a practical next action.',why:'Staff can see what supports an action and where uncertainty remains before preparing a reply.',trade:'The mapping must never imply a proven cause when the evidence only supports a working hypothesis.'}
];
designs.splice(0,designs.length,...refinementDesigns);
preferences.favorites=preferences.favorites.filter(n=>n>=0&&n<8);
preferences.defaultDesign=0;
let timelineTab='Analysis',timelineUtility='',timelineFilter='all';
const timelineEvents=[
{time:'10:42',kind:'client',title:'Client reports an unavailable website',body:'“example.com is not loading. Can you check where it points?”',source:'Client message · ticket #84216',status:'Reported',meaning:'The client cannot reach the site.',next:'Check service context and the current web response.'},
{time:'10:43',kind:'context',title:'Hosting service matched to the client',body:'Active service on NCR1. Recorded origin: 203.0.113.10.',source:'WHMCS · account snapshot',status:'Account fact',meaning:'A service exists and is active.',next:'Verify public routing; active does not prove healthy.'},
{time:'10:44',kind:'findings',title:'Public A record differs from the origin',body:'DNS returned 203.0.113.24. A proxy or CDN has not been ruled out.',source:'DNS A lookup · sample observation',status:'Needs interpretation',meaning:'Different IPs may be intentional.',next:'Confirm intended routing before changing DNS.'},
{time:'10:45',kind:'findings',title:'Website returned HTTP 503',body:'One failed HTTP observation. The certificate was valid during the sample TLS check.',source:'HTTP & TLS · sample observation',status:'Observed failure',meaning:'The web service was unavailable at this point.',next:'Inspect the origin and repeat the check.'},
{time:'10:46',kind:'actions',title:'Working diagnosis recorded',body:'Origin availability and proxy configuration need verification. A DNS mismatch alone is not a confirmed cause.',source:'Internal assessment · review needed',status:'Working hypothesis',meaning:'There is evidence of failure, not a proven cause.',next:'Keep uncertainty explicit in the reply.'},
{time:'10:47',kind:'actions',title:'Next action prepared',body:'Confirm proxy use, inspect the origin web service, then repeat HTTP checks.',source:'Internal action plan',status:'Proposed action',meaning:'The case has a specific next step.',next:'Update the client after verification.'}

state.technical='Expected origin from WHMCS: 203.0.113.10\nProxy or CDN status: not confirmed';
state.summaryText='Website unavailable. Hosting is active. Public DNS differs from the recorded origin, but a proxy has not been ruled out. HTTP returned 503 in one sample observation.';
const existingAction=action;
function logFilter(){return `<div class="log-filter">${['all','client','findings','actions'].map(x=>`<button class="small" data-log-filter="${x}" aria-pressed="${timelineFilter===x}">${x==='all'?'All events':x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>`}
function visibleEvents(mini=false){return timelineEvents.filter(x=>mini||timelineFilter==='all'||x.kind===timelineFilter)}
function logEntry(e){return `<article class="log-entry"><time>${e.time}</time><div class="entry-body"><h4>${esc(e.title)}</h4><p>${esc(e.body)}</p><div class="row"><span class="source-line">${esc(e.source)}</span><span class="chip${e.status==='Observed failure'?' warn':''}">${esc(e.status)}</span></div></div></article>`}
function chronology(mini=false,events=null){const rows=events||visibleEvents(mini);return `<section class="case-log"><div class="section-head"><h3>Case timeline</h3><span class="chip">${rows.length} events</span></div>${events?'':logFilter()}${rows.map(logEntry).join('')||'<p class="muted">No events match the selected filter.</p>'}</section>`}
function accountContext(){return `<section><div class="section-head"><h3>Case & service context</h3><span class="chip ok">Matched in WHMCS</span></div><div class="account-grid"><div><small>Client / service</small><b>Sandeep / Active hosting</b></div><div><small>Primary domain</small><b>example.com</b></div><div><small>Server / region</small><b>NCR1 (BOM1) / India</b></div><div><small>Server hostname</small><b>ncr1.host.example</b></div><div><small>Recorded origin</small><b>203.0.113.10</b></div><div><small>Public A record</small><b>203.0.113.24</b></div><div><small>Nameservers</small><b>ns1.host.example<br>ns2.host.example</b></div><div><small>Proxy / CDN</small><b>Not yet confirmed</b></div></div></section>`}
function responseBrief(){return `<section class="response-brief"><div class="section-head"><h3>Response brief</h3><span class="eyebrow">Instructions / Intent / Technical context</span></div><div class="brief-grid"><div>${field('instruction','Custom instructions · optional',state.instruction,'textarea')}</div><div>${field('technical','Technical context · logs, findings & custom intelligence',state.technical,'textarea')}<div class="row" style="margin-top:7px">${btn('Paste from clipboard','paste','small')}${btn('Append latest check','append-latest','quiet small')}</div></div><div class="intent-field">${intent()}</div></div><div class="generation-strip">${select('tone','AI tone',['Friendly','Professional','Technical','Strict'])}<label class="field">Dive intensity <span><output data-output="depth">${state.depth}</output> / 5</span><input type="range" min="1" max="5" value="${state.depth}" data-field="depth"></label>${select('model','Model for this generation',['Default · GPT 5.6 Luna','Replicate · google/gemini-3-flash','My preferred provider'])}</div>${evidenceOptions()}${generation()}</section>`}
reply=function(){return `<section class="reply"><div class="reply-paper"><div class="section-head"><h3>Proposed client reply</h3><span class="chip ok">AI score · 95/100 · sample</span></div><label class="field"><span class="eyebrow">Editable draft</span><textarea data-field="reply">${esc(state.reply)}</textarea></label><div class="reply-tools"><span class="muted" style="font-size:11px">Review the wording and evidence.</span><div class="row">${btn('Copy','copy','','copy')}${btn('Insert into ticket','insert','primary','insert')}</div></div><div class="metrics">Intent: ${esc(state.intent)} · 8,944 in / 534 out · 11.7 s · ${state.generation?'Revision '+state.generation:'Sample'}</div></div></section>`};
rewrite=function(){return `<section class="rewrite"><div class="section-head"><h3>Rewrite / Polish</h3><span class="eyebrow">Uses the WHMCS reply editor</span></div><p class="muted">Write instructions or a short reply above your signature in the ticket editor. This action expands that draft in place.</p><div class="row">${btn('Rewrite / Polish','rewrite','','spark')}${btn('Score Admin Draft','score','ghost')}${btn('Save as Canned','save-canned','ghost small')}${btn('Save KB Draft','save-kb','ghost small')}</div></section>`};
function outputPair(){return `<div class="grid2 block divider"><div>${reply()}</div><div>${rewrite()}</div></div>`}
tabs=function(){return `<nav class="tabs" role="tablist" aria-label="Sahdev sections">${['Analysis','Tools','Summary','KB','Memory'].map(t=>`<button type="button" role="tab" data-refinement-tab="${t}" aria-selected="${timelineTab===t}" tabindex="${timelineTab===t?0:-1}" class="${timelineTab===t?'active':''}">${t}</button>`).join('')}</nav>`};
function analysisRefinement(n,mini=false){if(n===0)return `<div class="investigation"><section class="block">${chronology(mini)}</section><aside class="block stack">${accountContext()}<div class="divider">${facts()}</div></aside></div><div class="response-grid"><section class="block">${responseBrief()}</section><section class="block stack">${reply()}<div class="divider">${rewrite()}</div></section></div>`;
if(n===1)return `<div class="three-lanes"><section class="block">${chronology(mini)}</section><section class="block stack">${accountContext()}<div class="divider">${facts()}</div><div class="divider">${responseBrief()}</div></section><section class="block stack">${reply()}<div class="divider">${rewrite()}</div></section></div>`;
if(n===2)return `<section class="block"><div class="section-head"><h3>Chronological evidence ledger</h3><span class="source-line">Time / observation / provenance</span></div>${logFilter()}<table class="evidence-table"><thead><tr><th>Time</th><th>What happened</th><th>Status</th></tr></thead><tbody>${visibleEvents(mini).map(e=>`<tr><td>${e.time}</td><td><h4>${esc(e.title)}</h4><p>${esc(e.body)}</p><span class="source-line">${esc(e.source)}</span></td><td><span class="chip">${esc(e.status)}</span></td></tr>`).join('')}</tbody></table></section><div class="ledger-bottom"><section class="block stack">${accountContext()}<div class="divider">${facts()}</div></section><section class="block">${responseBrief()}</section></div>${outputPair()}`;
if(n===3)return `<div class="split-history"><aside class="block">${chronology(mini)}</aside><main><div class="context-findings"><section class="block">${accountContext()}</section><section class="block">${facts()}</section></div><section class="block">${responseBrief()}</section>${outputPair()}</main></div>`;
if(n===4)return `<section class="block"><div class="section-head"><h3>The case, in sequence</h3><span class="source-line">Left to right, then down</span></div>${logFilter()}<div class="ribbon-events">${visibleEvents(mini).map(e=>`<article class="ribbon-event"><time>${e.time} / ${esc(e.kind)}</time><h4>${esc(e.title)}</h4><p>${esc(e.body)}</p><span class="source-line">${esc(e.source)}</span><div style="margin-top:10px"><span class="chip">${esc(e.status)}</span></div></article>`).join('')}</div></section><div class="ribbon-context divider"><section class="block">${accountContext()}</section><section class="block">${facts()}</section></div><section class="block divider">${responseBrief()}</section>${outputPair()}`;
if(n===5)return `<article class="journal-page"><div class="eyebrow">Case journal / 84216</div><h2 class="journal-title">A record of the case.<br>A clear next step.</h2><section class="journal-section"><aside>I. Case context</aside><div>${accountContext()}</div></section><section class="journal-section"><aside>II. What happened</aside><div>${chronology(mini)}</div></section><section class="journal-section"><aside>III. What it means</aside><div>${facts()}</div></section><section class="journal-section"><aside>IV. Response brief</aside><div>${responseBrief()}</div></section><section class="journal-section"><aside>V. Client reply</aside><div>${reply()}</div></section><section class="journal-section"><aside>VI. Draft refinement</aside><div>${rewrite()}</div></section></article>`;
if(n===6)return `<div class="milestone-columns"><section class="milestone"><div class="step-index">01</div><h2>Report</h2><p class="muted">The client’s request and service context.</p>${chronology(mini,visibleEvents(mini).filter(e=>['client','context'].includes(e.kind)))}<div class="divider" style="margin-top:20px">${accountContext()}</div></section><section class="milestone"><div class="step-index">02</div><h2>Verify</h2><p class="muted">Observed evidence and remaining uncertainty.</p>${chronology(mini,visibleEvents(mini).filter(e=>e.kind==='findings'))}<div class="notice" style="margin-top:20px">Different IPs may be intentional. The evidence does not yet justify a DNS change.</div></section><section class="milestone"><div class="step-index">03</div><h2>Decide</h2><p class="muted">The working explanation and next action.</p>${chronology(mini,visibleEvents(mini).filter(e=>e.kind==='actions'))}<div class="divider" style="margin-top:20px">${facts()}</div></section></div><section class="block divider">${responseBrief()}</section>${outputPair()}`;
return `<div class="map-context"><section class="block">${accountContext()}</section><section class="block">${facts()}</section></div><section class="block"><div class="section-head"><h3>Chronological evidence → next action</h3><span class="source-line">Every proposed action has a source</span></div><div class="action-matrix"><div class="matrix-head">Time</div><div class="matrix-head">Observation</div><div class="matrix-head">Meaning / uncertainty</div><div class="matrix-head">Next action</div>${visibleEvents(mini).map(e=>`<div class="source-line">${e.time}<p>${esc(e.kind)}</p></div><div><h4>${esc(e.title)}</h4><span class="source-line">${esc(e.source)}</span></div><div>${esc(e.meaning)}<p>${esc(e.body)}</p></div><div>${esc(e.next)}</div>`).join('')}</div></section><div class="map-response divider"><section class="block">${responseBrief()}</section><section class="block stack">${reply()}<div class="divider">${rewrite()}</div></section></div>`}
function savedLocal(){try{const d=JSON.parse(localStorage.getItem('sahdev-timeline-content')||'[]');return d.length?d.map(x=>`<article class="box"><h3>${esc(x.kind)}</h3><p style="white-space:pre-wrap">${esc(x.text)}</p></article>`).join(''):'<p class="muted">Save a canned response or KB draft from Analysis to keep it here.</p>'}catch{return '<p class="muted">Browser storage is unavailable.</p>'}}
function refinementTab(){if(timelineTab==='Tools')return `<h2>Checks with a visible trail.</h2><p class="muted">Run a sample check, inspect its outcome, and append useful evidence to the technical context.</p><div class="grid2"><section class="stack">${toolControls()}${field('technical','Technical context · editable',state.technical,'textarea')}</section><section class="stack">${evidence()}${chronology(false,timelineEvents.filter(e=>e.kind==='findings'))}${btn('Return to Analysis','analysis')}</section></div>`;
if(timelineTab==='Summary')return `<h2>A concise shared understanding.</h2><p class="muted">The summary sits beside the findings it describes.</p><div class="grid2"><section class="stack">${field('summaryText','Ticket summary',state.summaryText,'textarea')}${check('summary','Feed this summary into generation')}${btn('Refresh sample summary','refresh-summary','primary')}</section><section class="stack">${facts()}${accountContext()}</section></div>`;
if(timelineTab==='KB')return `<h2>Guidance and saved drafts.</h2><p class="muted">Keep useful guidance in the workspace.</p><div class="grid2"><section class="stack">${field('kbSearch','Search knowledge base',state.kbSearch||'DNS and proxy configuration')}<div class="row">${btn('Search sample articles','kb-search','primary')}${btn('Add guidance to context','use-kb')}</div><article class="box"><h3>DNS destinations and reverse proxies</h3><p class="muted">Compare authoritative records, expected origin and proxy configuration before recommending a change.</p><span class="source-line">Illustrative article · verify before use</span></article></section><section class="stack"><h3>Saved local content</h3>${savedLocal()}</section></div>`;
return `<h2>Relevant client history.</h2><p class="muted">Review prior context before making an assumption.</p><div class="grid2"><section class="stack">${select('memory','History depth',['Last 7 tickets','Last 15 tickets','Last 25 tickets'])}<div class="box"><h3>No confirmed CDN history in this sample</h3><p class="muted">Ask the client before assuming that a different public destination is incorrect.</p><span class="source-line">Illustrative memory · not a real customer record</span></div>${btn('Refresh sample memory','refresh-memory','primary')}</section><section>${accountContext()}</section></div>`}
function inlineUtility(){if(!timelineUtility)return '';return `<div class="inline-utility"><div class="section-head"><h3>${timelineUtility==='preferences'?'My Sahdev · local preferences':'Working in the page'}</h3>${btn('Done','close-utility','small')}</div><p class="muted">${timelineUtility==='preferences'?'Appearance, spacing and shortlist are saved in this browser. The original Concept 05 is preserved separately.':'Use Analysis, Tools, Summary, KB and Memory above. All generation and response controls remain visible in Analysis. Insert fills the local editor; nothing is sent.'}</p><div class="row"><span class="chip">Theme: ${preferences.theme}</span><span class="chip">Spacing: ${preferences.density}</span><span class="chip">Shortlisted: ${preferences.favorites.length} + original</span></div></div>`}
layout=function(n,mini=false){const t=mini?'Analysis':timelineTab;return `<div class="station timeline-station ${designs[n].class}">${header()}<div class="station-body"${state.collapsed&&!mini?' hidden':''}>${tabs()}${!mini?inlineUtility():''}<div class="module-context row between"><div><div class="eyebrow">Ticket #84216 / Technical support</div><h2>Website is not loading</h2><p>Sandeep · example.com · case history and current findings</p></div><div class="row"><span class="chip ok">Hosting active</span><span class="chip warn">HTTP 503 observed</span><span class="chip">Proxy unconfirmed</span></div></div><div role="tabpanel" aria-label="${t}">${t==='Analysis'?analysisRefinement(n,mini):`<div class="case-tab-pane">${refinementTab()}</div>`}</div>${!mini?`<section class="inline-editor"><div class="section-head"><h3>Ticket reply editor · local preview</h3><span class="chip">Not sent</span></div>${field('editor','Insert the proposed reply here, then review it',state.editor,'textarea')}<div class="row" style="margin-top:10px">${btn('Clear editor preview','clear-editor','small')}</div></section>`:''}<div class="footer-bar"><p>Sample ticket #84216 · findings retain their source and time</p><p>Draft → review → insert</p></div></div></div>`};
function originalDoc(){let html=new TextDecoder().decode(Uint8Array.from(atob(timelineBaseline),c=>c.charCodeAt(0)));html=html.replace('</head>','<style>.labbar,.detail-head,.design-notes,.demo-label{display:none!important}.labwrap{padding:0;max-width:none}</style></head>');html=html.replace("applyPrefs();const match=location.hash.match(/^#concept-(\\d+)$/);if(match)detail(Number(match[1])-1);else gallery();","preferences.theme='"+preferences.theme+"';preferences.density='"+preferences.density+"';applyPrefs();detail(4);");return html}
function loadOriginalFrames(){document.querySelectorAll('[data-original-frame]').forEach(f=>f.srcdoc=originalDoc())}
function refinementCard(i){const d=designs[i];return `<article class="concept-card"><div class="preview"><div class="preview-inner" inert aria-hidden="true">${layout(i,true)}</div></div><div class="card-info"><div class="card-number">T${String(i+1).padStart(2,'0')} / ${d.tag}</div><h2>${d.name}</h2><p>${d.summary}</p><div class="card-footer"><button class="primary" data-refinement-open="${i}">Explore refinement ↗</button><button class="favorite" data-refinement-shortlist="${i}" aria-pressed="${preferences.favorites.includes(i)}">${preferences.favorites.includes(i)?'★ Saved':'☆ Shortlist'}</button><span class="grow"></span><button class="small ghost" data-compare-original="${i}">Compare original</button></div></div></article>`}
function refinementView(v){view=v;['gallery','detail','compare'].forEach(x=>{const el=document.getElementById(x+'-view');el.hidden=x!==v;if(x!==v)el.querySelectorAll('[data-original-frame]').forEach(f=>f.remove())})}
gallery=function(){timelineTab='Analysis';refinementView('gallery');const ids=designs.map((_,i)=>i).filter(i=>filter==='all'||preferences.favorites.includes(i));document.getElementById('gallery-view').innerHTML=`<div class="hero"><div><div class="eyebrow">Round 02 / Timeline-led refinements</div><h1>The case comes first.<br>The controls stay close.</h1><p>Eight refinements of your shortlisted direction. Timeline, case context and findings lead. The response brief and remaining controls stay visible in Analysis.</p></div><div class="principles"><div><b>01 · Understand the case</b><p>Chronology, sources, verified context and working findings.</p></div><div><b>02 · Direct the response</b><p>Custom instructions, intent and technical context.</p></div><div><b>03 · Keep controls visible</b><p>Model, tone, depth, evidence options and all reply actions.</p></div><div><b>04 · Use the existing tabs</b><p>Analysis, Tools, Summary, KB and Memory. No side popouts.</p></div></div></div><section class="pinned-original"><div><div class="eyebrow">★ Your shortlist / Original preserved</div><h2>Concept 05 · Case Timeline</h2><p>The exact earlier version is stored separately. It stays pinned while we explore these refinements.</p></div><div class="row">${btn('Open preserved original','baseline','primary')}${btn('Compare shortlist','compare')}</div></section><div class="gallery-toolbar"><div class="segment"><button data-refinement-filter="all" aria-pressed="${filter==='all'}">All 8 refinements</button><button data-refinement-filter="shortlist" aria-pressed="${filter==='shortlist'}">Shortlist · ${preferences.favorites.length} + original</button></div><span class="muted" style="font-size:12px">Live HTML previews · no external assets</span></div><div class="gallery timeline-gallery">${ids.map(refinementCard).join('')||'<div class="empty">The original is pinned above. Star a refinement to add it here.</div>'}</div>`;scalePreviews()};
detail=function(i,scroll=true){current=Math.max(0,Math.min(7,i));refinementView('detail');const d=designs[current];document.getElementById('detail-view').innerHTML=`<div class="detail-head"><div>${btn('← All refinements','gallery','ghost')}<div class="detail-title"><div class="eyebrow">T${String(current+1).padStart(2,'0')} / ${d.tag}</div><h1>${d.name}</h1><p>${d.summary}</p></div></div><div class="row">${btn('Previous','previous','small')}${btn('Next','next','small')}<button class="favorite" data-refinement-shortlist="${current}" aria-pressed="${preferences.favorites.includes(current)}">${preferences.favorites.includes(current)?'★ Saved':'☆ Shortlist'}</button><button data-compare-original="${current}">Compare original</button></div></div><div class="refinement-notes"><div><strong>Why this arrangement</strong>${d.why}</div><div><strong>Trade-off</strong>${d.trade}</div></div><div class="refinement-note">Local interactive prototype · illustrative ticket and results · all response controls are inline</div><div id="stage">${layout(current)}</div>`;if(scroll)window.scrollTo(0,0)};
refresh=function(){if(view==='detail'&&current>=0){document.getElementById('stage').innerHTML=layout(current);document.querySelectorAll('#stage [data-action=generate],#stage [data-action=regenerate],#stage [data-action=run-tool]').forEach(b=>b.disabled=state.busy||state.toolState==='running')}};
function originalView(){current=-1;refinementView('detail');document.getElementById('detail-view').innerHTML=`<div class="detail-head"><div>${btn('← All refinements','gallery','ghost')}<div class="eyebrow">Preserved shortlist / Original Concept 05</div><h1>Case Timeline</h1><p class="muted">The earlier version you selected, with its original controls and interactions.</p></div><span class="chip ok">★ Pinned · original snapshot</span></div><iframe class="original-frame" data-original-frame title="Preserved original Case Timeline" sandbox="allow-scripts allow-same-origin"></iframe>`;loadOriginalFrames();window.scrollTo(0,0)}
compare=function(one=null){timelineTab='Analysis';refinementView('compare');const ids=one===null?preferences.favorites:[one];document.getElementById('compare-view').innerHTML=`<div class="detail-head"><div>${btn('← All refinements','gallery','ghost')}<h1>Compare with your original.</h1><p class="muted">The original remains pinned. Add refinements to your shortlist as you review.</p></div></div><div class="compare-grid timeline-comparison"><article><div class="preview"><div class="preview-inner original-preview" inert aria-hidden="true"><iframe data-original-frame title="Original Case Timeline preview" tabindex="-1" sandbox="allow-scripts allow-same-origin"></iframe></div></div><div class="card-info"><div class="eyebrow">★ Preserved / Concept 05</div><h2>Original Case Timeline</h2><p>The starting point you shortlisted, preserved separately.</p>${btn('Open original','baseline','primary')}</div></article>${ids.map(refinementCard).join('')}</div>`;loadOriginalFrames();scalePreviews();window.scrollTo(0,0)};
// Existing action handlers resolve this function dynamically. All former drawers now use in-page tabs.
drawer=function(type){const map={analysis:'Analysis',tools:'Tools',summary:'Summary',kb:'KB',memory:'Memory',context:'Analysis',settings:'Analysis','rewrite-panel':'Analysis','edit-reply':'Analysis'};if(map[type])timelineTab=map[type];else if(type==='preferences'||type==='help'||type==='resources')timelineUtility=type==='preferences'?'preferences':'help';refresh()};
action=async function(a){if(a==='baseline'){originalView();return}if(a==='next'||a==='previous'){timelineTab='Analysis';detail((current+(a==='next'?1:7))%8);return}if(a==='preferences'||a==='help'){if(view!=='detail'||current<0)detail(0);timelineUtility=timelineUtility===a?'':a;refresh();return}if(a==='close-utility'){timelineUtility='';refresh();return}if(a==='insert'){state.editor=state.reply;refresh();document.querySelector('#stage .inline-editor')?.scrollIntoView({block:'center',behavior:'smooth'});toast('Draft inserted into the local editor. Nothing was sent.');return}if(a==='append-latest'||a==='append-tool'){const e=[...timelineEvents].reverse().find(x=>x.kind==='findings');state.technical+=(state.technical?'\n':'')+e.time+' · '+e.title+' — '+e.body;refresh();toast('Latest observation appended with its time.');return}if(a==='run-tool'){if(state.toolState==='running')return;await existingAction(a);setTimeout(()=>{timelineEvents.push({time:'10:'+String(48+timelineEvents.length-6).padStart(2,'0'),kind:'findings',title:state.tool+(state.toolState==='failed'?' timed out':' completed'),body:state.toolState==='failed'?'No current result is available. Earlier observations are retained.':'New sample observation for '+state.target+'. No live request was made.',source:'Local tool simulation',status:state.toolState==='failed'?'Unavailable':'Sample result',meaning:state.toolState==='failed'?'The result remains unknown.':'A new sample observation is available.',next:'Review the observation before using it in a reply.'});refresh()},700);return}if(a==='save-canned'||a==='save-kb'){try{const items=JSON.parse(localStorage.getItem('sahdev-timeline-content')||'[]');items.push({kind:a==='save-kb'?'KB draft':'Canned response',text:state.rough||state.reply});localStorage.setItem('sahdev-timeline-content',JSON.stringify(items));toast('Saved locally. Review it in the KB tab.')}catch{toast('Storage unavailable; your draft is still visible.')}return}if(a==='refresh-summary'){state.summaryText='The case contains '+timelineEvents.length+' events. Hosting is active; proxy use remains unconfirmed. '+(state.toolState==='failed'?'The latest check is unavailable.':'One sample HTTP observation returned 503.');refresh();toast('Sample summary refreshed.');return}if(a==='kb-search'){toast('Showing sample guidance for DNS and proxies.');return}if(a==='score'){toast(state.rough.trim()?'Review clarity, evidence and the next action. AI scoring is simulated.':'Add a rough reply first.');return}await existingAction(a)};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.closest('[inert]'))return;if(b.dataset.refinementOpen!==undefined){timelineTab='Analysis';timelineUtility='';state.collapsed=false;detail(Number(b.dataset.refinementOpen));return}if(b.dataset.refinementShortlist!==undefined){const n=Number(b.dataset.refinementShortlist);preferences.favorites=preferences.favorites.includes(n)?preferences.favorites.filter(x=>x!==n):[...preferences.favorites,n];savePrefs();if(view==='gallery')gallery();else if(view==='detail')detail(current,false);else compare();return}if(b.dataset.refinementFilter){filter=b.dataset.refinementFilter;gallery();return}if(b.dataset.compareOriginal!==undefined){compare(Number(b.dataset.compareOriginal));return}if(b.dataset.refinementTab){timelineTab=b.dataset.refinementTab;timelineUtility='';refresh();document.querySelector('#stage [data-refinement-tab="'+timelineTab+'"]').focus();return}if(b.dataset.logFilter){timelineFilter=b.dataset.logFilter;refresh()}});
document.addEventListener('keydown',e=>{if(!e.target.dataset.refinementTab||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const list=['Analysis','Tools','Summary','KB','Memory'];let i=list.indexOf(timelineTab);i=e.key==='Home'?0:e.key==='End'?4:(i+(e.key==='ArrowRight'?1:4))%5;timelineTab=list[i];refresh();document.querySelector('#stage [data-refinement-tab="'+timelineTab+'"]').focus()});
document.addEventListener('change',e=>{if(e.target.dataset.pref&&document.querySelector('[data-original-frame]'))loadOriginalFrames()});
document.querySelector('.labbar .brand small').textContent=' / Timeline refinements';
document.querySelector('.labbar [data-action=preferences]').textContent='My Sahdev';
document.title='Sahdev · Timeline refinements';
gallery();
const beforeEditorAction=action;
action=async function(a){
 if(a==='rewrite'){
  if(!state.editor.trim()){toast('Write instructions or a short reply in the ticket editor preview first.');return}
  toast('Local preview only: production polishes the WHMCS editor draft above its signature.');
  document.querySelector('#stage .inline-editor')?.scrollIntoView({block:'center',behavior:'smooth'});return;
 }
 if(['score','save-canned','save-kb'].includes(a))state.rough=state.editor;
 return beforeEditorAction(a);
};
</script>

</body></html>
