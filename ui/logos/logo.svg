<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="100%" stop-color="#04090c"/>
    </radialGradient>
    <linearGradient id="latticeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="cortexGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Rounded Squircle Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#134e4a" stroke-width="2" opacity="0.5"/>

  <g filter="url(#cortexGlow)">
    <!-- Hexagonal Matrix Synaptic Lines forming 'S' -->
    <path d="M 330 150 L 256 110 L 182 150 L 182 230 L 256 270 L 330 310 L 330 390 L 256 430 L 182 390" 
          fill="none" 
          stroke="url(#latticeGrad)" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Cross Synaptic Connectors -->
    <line x1="256" y1="110" x2="256" y2="270" stroke="#2dd4bf" stroke-width="4" stroke-dasharray="6 6" opacity="0.6"/>
    <line x1="256" y1="270" x2="256" y2="430" stroke="#3b82f6" stroke-width="4" stroke-dasharray="6 6" opacity="0.6"/>
    <line x1="182" y1="230" x2="330" y2="310" stroke="#06b6d4" stroke-width="3" opacity="0.5"/>

    <!-- Neural Synapse Nodes -->
    <circle cx="330" cy="150" r="14" fill="#2dd4bf"/>
    <circle cx="256" cy="110" r="16" fill="#5eead4"/>
    <circle cx="182" cy="150" r="14" fill="#2dd4bf"/>
    <circle cx="182" cy="230" r="14" fill="#14b8a6"/>
    <circle cx="256" cy="270" r="18" fill="#ffffff"/>
    <circle cx="330" cy="310" r="14" fill="#0ea5e9"/>
    <circle cx="330" cy="390" r="14" fill="#0284c7"/>
    <circle cx="256" cy="430" r="16" fill="#38bdf8"/>
    <circle cx="182" cy="390" r="14" fill="#3b82f6"/>

    <!-- Node Center Pulses -->
    <circle cx="256" cy="270" r="8" fill="#06b6d4"/>
  </g>
</svg>
